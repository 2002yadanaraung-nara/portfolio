<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Product preview card component</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");

      * {
        font-family: "Montserrat", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
      }

      h1,
      strong {
        font-family: "Fraunces", serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-variation-settings:
          "SOFT" 0,
          "WONK" 0;
      }
    </style>

    <style type="text/tailwindcss">
      @theme {
        --color-Green-500: hsl(158, 36%, 37%);
        --color-Green-700: hsl(158, 42%, 18%);
        --color-Black: hsl(212, 21%, 14%);
        --color-Grey: hsl(228, 12%, 48%);
        --color-Cream: hsl(30, 38%, 92%);
        --color-White: hsl(0, 0%, 100%);
      }
    </style>
  </head>
  <body>
    <div class="bg-Cream min-h-screen grid place-items-center px-4 py-8">
      <div
        class="max-w-xl grid md:grid-cols-2 bg-white rounded-lg overflow-hidden"
      >
        <div class="">
          <img
            src="images/image-product-desktop.jpg"
            alt="img"
            class="w-full object-cover hidden md:block"
          />
          <img
            src="images/image-product-mobile.jpg"
            alt="img"
            class="w-full object-cover md:hidden"
          />
        </div>

        <div class="p-8">
          <h5 class="text-Grey uppercase tracking-[0.3em] text-xs font-medium">
            Perfume
          </h5>
          <h1 class="font-bold text-Black text-3xl leading-8 my-4">
            Gabrielle Essence Eau De Parfum
          </h1>
          <p class="text-sm text-Grey leading-5 font-medium">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="my-6 flex items-center gap-4">
            <strong class="text-Green-500 text-3xl font-bold">$149.99</strong>
            <del class="text-Grey text-sm">$169.99</del>
          </div>
          <button
            class="bg-Green-500 w-full flex items-center justify-center gap-2 py-3 text-white font-medium rounded-lg hover:bg-Green-700 duration-300"
          >
            <img src="images/icon-cart.svg" alt="cart" />
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
